server.port=8080
spring.application.name=GameVault
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB

# (Opcional) Usamos H2 en memoria para que Spring Data JPA pueda arrancar feliz
# sin necesidad de tener un servidor MySQL encendido.
spring.datasource.url=jdbc:mysql://localhost:3306/gamevaultdb?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=ITSON
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update