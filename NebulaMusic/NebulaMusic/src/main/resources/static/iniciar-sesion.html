<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Iniciar Sesión</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            <form method="post" action="/autentation" enctype="application/x-www-form-urlencoded">
                <h1>Inicio de sesión</h1>
                <div>
                    <label for="correo">
                        Correo Electronico
                    </label>
                    <input type="email" name="correo" id="correo" placeholder="correo@dominio.com" required minlength="5" maxlength="100">
                </div>
                <div>
                    <label for="contrasenia">Contraseña: </label>
                    <input type="password" name="contrasenia" id="contrasenia" placeholder="****" required>
                </div>
                <div>
                    <button type="reset">Limpiar formulario</button>
                    <button type="submit">Iniciar sesión</button>
                </div>
            </form>
            <p>¿Aún no tienes cuenta? <a href="registro.html">Registrate aqui</a></p>
        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
