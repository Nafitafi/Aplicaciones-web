<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            
            <!-- TAREA PARA EL ALUMNO:
                 Crea un formulario que envíe los datos mediante POST a "/crear-cuenta".
                 Debe contener campos para:
                 - Nombre completo (texto)
                 - Correo electrónico (email)
                 - Contraseña (password)
                 - Pseudónimo (texto con patrón de validación: [letras de 3 a 10]-[números de 2 a 10])
                 - Género (radio buttons: Femenino, Masculino, Otro)
                 - Tipo de Suscripción (select: Gratis, Premium Mensual, Premium Anual)
                 - Fecha de nacimiento (date)
                 - Aceptar términos y condiciones (checkbox)
                 - Comentarios adicionales o gustos (textarea)
            -->

            <form class="auth-form" method="post" action="/crear-cuenta" enctype="application/x-www-form-urlencoded">
                <!-- Escribe tus etiquetas (label) e inputs aquí -->
                <h1>Crear cuenta</h1>
                <div>
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="ej. Nahomi Figueroa" required minlength="3" maxlength="80">
                </div>
                <div>
                    <label for="correo">Correo electronico:</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@dominio.com" required maxlength="100">
                </div>
                <div>
                    <label for="contrasenia">Contraseña:</label>
                    <input type="password" id="contrasenia" name="contrasenia" placeholder="Minimo 8 caracteres" required minlength="8" autocomplete="off">
                </div>
                <div>
                    <label for="pseudonimo">Pseudonimo</label>
                    <input type="text" id="pseudonimo" name="pseudonimo" required pattern="[a-zA-Z]{3,10}--[0-9]{2,10}" placeholder="Nebula-2025" minlength="6">
                </div>
                <div>
                    <label>Genero:</label>
                    <input type="radio" value="femenino" id="rad_femenino" name="genero" required>
                    <label for="rad_femenino">Femenino</label>

                    <input type="radio" value="masculino" id="rad_masculino" name="genero">
                    <label for="rad_masculino">Masculino</label>

                    <input type="radio" value="otro" id="rad_otro" name="genero">
                    <label for="rad_otro">Otro</label>
                </div>
                <div>
                    <label for="subscripcion">Tipo de subscripción</label>
                    <select id="subscripcion" name="subscripcion" required>
                        <option value="">---- Selecciona una opción ----</option>
                        <option value="gratis">Gratis(Con anuncios)</option>
                        <option value="premium_mensual">Premium Mensual ($99/mes)</option>
                        <option value="premium_anual">Premium anual (899/mes)</option>
                    </select>
                </div>
                <div>
                    <label for="fecha_nacimiento">Fecha de nacimiento:</label>
                    <input type="date" id="fecha_nacimiento" required>
                </div>
                <div>
                    <input type="checkbox" id="terminos" value="aceptado" required>
                    <label for="terminos">Acepto los terminos y condiciones</label>
                </div>
                <div>
                    <label for="comentarios">Comentarios o gustos:</label>
                    <textarea id="comentarios" name="comentarios" rows="4" cols="40" placeholder="¡Cuentanos qué te gusta!"></textarea>
                </div>
                        <div>
                    <button type="reset">Limpiar formulario</button>
                    <button type="submit">Iniciar sesión</button>
                </div>
            </form>
            <p>¿Ya tienes cuenta? <a href="iniciar-sesion.html">Inicia sesión aqui</a></p>
        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
