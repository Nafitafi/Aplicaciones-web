        .parent{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 100px);
            gap: 5px;
            max-width: 500px;
            border: 1px solid darkblue;
            border-radius: 3px;
            padding: 5px;
            background-color: lightsteelblue;
        }

        .parent div{
            border: 1px solid indigo;
            background-color: #8D91C7;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
        .div1{
            /*
            Fila inicio, columna inicio. fila fin, columna fin. Termina antes de llegar. rememba
             */
            grid-area: 1/1/3/2;
        }
        .div2{
            grid-area: 1/2/3/4;
        }
        .div3{
            grid-area: 1/4/2/5;
        }
        .div4{
            grid-area: 2/4/3/5;
        }
        .div5{
            grid-area: 3/1/5/3;
        }
        .div6{
            grid-area: 4/3/5/5;
        }
        .div7{
            grid-area: 3/3/4/5;
        }
