server.port=8080
spring.application.name=GameVault

# MySQL: createDatabaseIfNotExist=true crea 'gamevaultdb' si no existe. Ajusta usuario y contraseña.
spring.datasource.url=jdbc:mysql://localhost:3306/gamevaultdb?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345
# update: crea/actualiza tablas sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que genera JPA.
spring.jpa.show-sql=true

# Cloudinary: pon tus credenciales aquí y nunca las subas a un repo público.
cloudinary.cloud_name=
cloudinary.api_key=
cloudinary.api_secret=
