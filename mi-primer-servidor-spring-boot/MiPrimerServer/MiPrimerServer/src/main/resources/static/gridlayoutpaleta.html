<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grid Layout</title>
    <link rel="stylesheet" href="gridlayoutstyles.css">
</head>
<body>
<section class="grid-container">
    <header class="grid-item item-header">Header</header>
    <nav class="grid-item item-nav">Navigation</nav>
    <aside class="grid-item item-aside">Aside</aside>
    <article class="grid-item item-content">Content</article>
    <section class="grid-item item-section">Section</section>
    <footer class="grid-item item-footer">Footer</footer>
</section>
</body>
