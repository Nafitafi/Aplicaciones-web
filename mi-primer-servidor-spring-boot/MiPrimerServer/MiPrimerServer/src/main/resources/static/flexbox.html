<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demo flexbox</title>
    <style>
        .contendor{
            border: 2px solid black;
            padding: 10px;
            background: beige;
            display: flex;
            gap: 15px;
            height: 180px;
            justify-content:center;
            align-items: center;
            flex-direction: column;
        }
        .caja{
            width: 80px;
            height: 60px;
            background-color: #9b7bb5;
            color: white;
        }
    </style>
</head>
<body>
    <div class="contendor">
        <div class="caja">1</div>
        <div class="caja">2</div>
        <div class="caja">3</div>
        <div class="caja">4</div>
    </div>
</body>
</html>
