<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería CSS Grid</title>
    <link rel="stylesheet" href="imagenesstyles.css">
</head>
<body>

<header class="header">
    <h1>Galería</h1>
</header>
    <main class="gallery-grid">
        <article class="card card-tall">
            <figure>
                <img src="imgs/painting.jpg" alt="Pintura">
                <figcaption>Hobbies: Pintura</figcaption>
            </figure>
        </article>
        <article class="card">
            <figure>
                <img src="imgs/sallyface.jpg" alt="Sally Face">
                <figcaption>Gustos: Sally Face</figcaption>
            </figure>
        </article>
        <article class="card card-large">
            <figure>
                <img src="imgs/comida.jpg" alt="Dumplings">
                <figcaption>Comida: Dumplings</figcaption>
            </figure>
        </article>
        <article class="card">
            <figure>
                <img src="imgs/musica.jpg" alt="Música">
                <figcaption>Música!!</figcaption>
            </figure>
        </article>
        <article class="card card-tall">
            <figure>
                <img src="imgs/deporte.jpg" alt="Ciclismo">
                <figcaption>Deportes: Cheerleading</figcaption>
            </figure>
        </article>
        <article class="card">
            <figure>
                <img src="imgs/movies.jpg" alt="Cine">
                <figcaption>Películas: Cine</figcaption>
            </figure>
        </article>
        <article class="card card-wide">
            <figure>
                <img src="imgs/videogames.jpg" alt="Videojuegos">
                <figcaption>Hobbies: Videojuegos</figcaption>
            </figure>
        </article>
        <article class="card">
            <figure>
                <img src="imgs/postres.jpg" alt="Postres">
                <figcaption>Comida: Postres</figcaption>
            </figure>
        </article>
    </main>
</body>
</html>
